<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ShelfWise{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="topbar"><a class="brand" href="{{ url_for('shop.dashboard') }}">ShelfWise <small>Bookshop management</small></a>{% if current_user.is_authenticated %}<nav><a href="{{ url_for('shop.books') }}">Books</a><a href="{{ url_for('shop.customers') }}">Customers</a><a href="{{ url_for('shop.new_sale') }}">New sale</a><a href="{{ url_for('shop.sales') }}">Sales</a></nav><form method="post" action="{{ url_for('auth.logout') }}">{{ csrf_token() }}<button>Sign out</button></form>{% endif %}</header><main class="container">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
