{% extends 'base.html' %}{% block content %}<p class="eyebrow">CATALOGUE</p><h1>Add a book</h1><section class="panel"><form method="post" class="form-grid">{{ csrf_token() }}<label>ISBN<input name="isbn" maxlength="20" required></label><label>Title<input name="title" maxlength="180" required></label><label>Author<input name="author" maxlength="120" required></label><label>Category<input name="category" value="Uncategorised" maxlength="80"></label><label>Publisher<input name="publisher" maxlength="120"></label><label>Unit price<input type="number" name="unit_price" min="0" step="0.01" required></label><label>Opening stock<input type="number" name="stock_quantity" min="0" step="1" value="0" required></label><label>Low-stock threshold<input type="number" name="low_stock_threshold" min="0" step="1" value="5" required></label><button class="primary">Save book</button></form></section>{% endblock %}
