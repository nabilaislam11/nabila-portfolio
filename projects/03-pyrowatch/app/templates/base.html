<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}PyroWatch{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('main.dashboard') }}">PyroWatch</a>{% if current_user.is_authenticated %}<nav><a href="{{ url_for('main.dashboard') }}">Dashboard</a><a href="{{ url_for('main.analyze') }}">Analyze media</a><form method="post" action="{{ url_for('auth.logout') }}">{{ csrf_token() }}<button>Sign out</button></form></nav>{% endif %}</header><main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Reference implementation · Not a certified fire-safety system</footer></body></html>
