{% extends "base.html" %}{% block content %}<p class="eyebrow">ACADEMICS</p><h1>Subjects</h1><section class="panel"><h2>Add subject</h2><form method="post" class="form-grid">{{ csrf_token() }}<label>Subject code<input name="subject_code" required></label><label>Subject name<input name="subject_name" required></label><button type="submit">Add subject</button></form></section><section class="panel"><h2>Subject directory</h2><table><thead><tr><th>Code</th><th>Subject</th></tr></thead><tbody>{% for s in subjects %}<tr><td>{{ s.subject_code }}</td><td>{{ s.subject_name }}</td></tr>{% else %}<tr><td colspan="2">No subjects configured.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
