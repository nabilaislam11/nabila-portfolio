name: Project validation

on:
  push:
    branches:
      - portfolio-projects-development
    paths:
      - "projects/01-campusdesk/**"
      - "projects/02-shelfwise/**"
      - "projects/03-pyrowatch/**"
      - ".github/workflows/project-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/01-campusdesk/**"
      - "projects/02-shelfwise/**"
      - "projects/03-pyrowatch/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CampusDesk
            directory: projects/01-campusdesk
            command: python -m unittest discover -s tests -v
          - name: ShelfWise
            directory: projects/02-shelfwise
            command: python -m pytest -q
          - name: PyroWatch
            directory: projects/03-pyrowatch
            command: python -m pytest -q

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python source
        working-directory: ${{ matrix.directory }}
        run: python -m compileall -q .

      - name: Run automated tests
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}
