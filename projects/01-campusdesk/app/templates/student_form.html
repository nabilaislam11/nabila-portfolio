{% extends "base.html" %}{% block content %}<h1>{{ 'Edit student' if student else 'Add student' }}</h1><form method="post" class="panel form-grid">{{ csrf_token() }}<label>Student ID<input name="student_code" required value="{{ student.student_code if student else '' }}" {% if student %}readonly{% endif %}></label><label>Full name<input name="full_name" required value="{{ student.full_name if student else '' }}"></label><label>Class<select name="class_id" required>{% for c in classes %}<option value="{{ c.id }}" {% if student and student.class_id==c.id %}selected{% endif %}>{{ c.display_name }}</option>{% endfor %}</select></label><label>Guardian name<input name="guardian_name" required value="{{ student.guardian_name if student else '' }}"></label><label>Guardian phone<input name="guardian_phone" required value="{{ student.guardian_phone if student else '' }}"></label><label>Email<input type="email" name="email" value="{{ student.email if student and student.email else '' }}"></label>{% if student %}<label>Status<select name="status"><option>Active</option><option {% if student.status=='Inactive' %}selected{% endif %}>Inactive</option></select></label>{% endif %}<button type="submit">Save student</button></form>{% endblock %}
